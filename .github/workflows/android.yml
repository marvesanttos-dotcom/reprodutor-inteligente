name: Gerar APKs Android

on:
  workflow_dispatch:
  push:
    branches: [ "main", "implementacao-painel-ativacao" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar APKs
        run: gradle assembleDebug
      - name: Guardar APK do reprodutor
        uses: actions/upload-artifact@v4
        with:
          name: ReprodutorInteligente-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Guardar APK do painel
        uses: actions/upload-artifact@v4
        with:
          name: PainelAtivacao-debug
          path: painel/build/outputs/apk/debug/painel-debug.apk
